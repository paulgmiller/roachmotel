# Build examples/Dockerfile and publish/load the image into your test cluster first.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visits
  namespace: tenant-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visits
  template:
    metadata:
      labels:
        app: visits
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: roachmotel-demo:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          env:
            - name: ROACHMOTEL_DATABASE_URL_FILE
              value: /var/run/roachmotel/connection-string
          volumeMounts:
            - name: credentials
              mountPath: /var/run/roachmotel
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: roachmotel-credentials
            defaultMode: 0440
