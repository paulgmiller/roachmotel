# Only platform administrators should modify this configuration.
infrastructureNamespace: roachmotel-system
certManagerNamespace: cert-manager
kyvernoNamespace: kyverno
clusterDomain: cluster.local
region: local
storageClass: "" # Empty selects the cluster's default StorageClass.
storageSize: 100Gi
excludedNamespaces:
  - kube-system
  - kube-public
  - kube-node-lease
  - cockroach-operator-system
# false permits plaintext application SQL with password authentication.
# Database nodes and infrastructure administrator connections still use TLS.
workloadTLS: true
defaultFsGroup: 2000
