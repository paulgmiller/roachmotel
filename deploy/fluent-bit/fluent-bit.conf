# Container logs -> Kubernetes metadata -> logs.public.containers in CockroachDB.
# The init container fills DATABASE_HOST/PORT from roachkey's DATABASE_URL.
# Fluent Bit expands DATABASE_URL from its Secret-backed environment at startup.
[SERVICE]
    # Flush buffered batches every five seconds; allow thirty seconds to drain on exit.
    Flush                     5
    Grace                     30
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf
    # Kubernetes readiness/liveness probes use this metrics endpoint.
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    # Persist pending chunks on the node so collector restarts can resume delivery.
    storage.path              /var/lib/fluent-bit/buffer
    storage.sync              normal
    storage.checksum          On
    storage.backlog.mem_limit 32M

[INPUT]
    Name                      tail
    # Collect all namespaces; symlink targets must be reachable under /var/log.
    Path                      /var/log/containers/*.log
    # The expanded source filename stays in the tag even if metadata lookup fails.
    Tag                       kube.*
    multiline.parser          docker, cri
    # Persist file offsets separately from buffered chunks to resume after restarts.
    DB                        /var/lib/fluent-bit/tail.db
    DB.Sync                   Normal
    # First install reads available files from the beginning; later runs use offsets.
    Read_from_Head            On
    Rotate_Wait               30
    # Skip oversized lines rather than abandoning the rest of that file.
    Buffer_Max_Size           1M
    Skip_Long_Lines           On
    storage.type              filesystem

[FILTER]
    Name                      kubernetes
    Match                     kube.*
    Kube_Tag_Prefix           kube.var.log.containers.
    # Add pod/namespace metadata and merge structured JSON, retaining the original log.
    Merge_Log                 On
    Keep_Log                  On
    # Pod annotations cannot change parsing or exclude records from collection.
    K8S-Logging.Parser        Off
    K8S-Logging.Exclude       Off

[OUTPUT]
    Name                      pgsql
    Match                     kube.*
    # This plugin overrides the URL endpoint, so init derives these from that same URL.
    Host                      ${DATABASE_HOST}
    Port                      ${DATABASE_PORT}
    # libpq accepts a complete PostgreSQL URI here, including credentials and TLS options.
    Database                  ${DATABASE_URL}
    # One shared table; namespace information remains in each record and its tag.
    Table                     containers
    # Use CockroachDB-compatible SQL and wait for each insert result before success.
    CockroachDB               On
    Async                     Off
    # The plugin logs its Database setting at info level; it contains credentials.
    Log_Level                 error
    # Retry failed batches indefinitely. Retries may duplicate already committed rows.
    Retry_Limit               False
    # Per-node output queue: oldest chunks are dropped once this limit is reached.
    storage.total_limit_size  1G
