[SERVICE]
    Flush                     5
    Grace                     30
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    storage.path              /var/lib/fluent-bit/buffer
    storage.sync              normal
    storage.checksum          On
    storage.backlog.mem_limit 32M

[INPUT]
    Name                      tail
    Path                      /var/log/containers/*.log
    Tag                       kube.*
    multiline.parser          docker, cri
    DB                        /var/lib/fluent-bit/tail.db
    DB.Sync                   Normal
    Read_from_Head            On
    Rotate_Wait               30
    Buffer_Max_Size           1M
    Skip_Long_Lines           On
    storage.type              filesystem

[FILTER]
    Name                      kubernetes
    Match                     kube.*
    Kube_Tag_Prefix           kube.var.log.containers.
    Merge_Log                 On
    Keep_Log                  On
    K8S-Logging.Parser        Off
    K8S-Logging.Exclude       Off

[OUTPUT]
    Name                      http
    Match                     kube.*
    Host                      log-writer.logs.svc.cluster.local
    Port                      8080
    URI                       /logs
    Format                    json
    Json_Date_Key             __fluentbit_time
    Json_Date_Format          iso8601
    Header_Tag                X-Log-Tag
    Retry_Limit               False
    storage.total_limit_size  1G
