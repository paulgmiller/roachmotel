apiVersion: v1
kind: Namespace
metadata:
  name: logs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: roachmotel-fluent-bit
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - namespaces
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: roachmotel-fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: roachmotel-fluent-bit
subjects:
- kind: ServiceAccount
  name: fluent-bit
  namespace: logs
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logs
spec:
  selector:
    matchLabels:
      app: roachmotel-fluent-bit
  template:
    metadata:
      labels:
        app: roachmotel-fluent-bit
    spec:
      serviceAccountName: fluent-bit
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - operator: Exists
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:4.2.3
        args:
        - -c
        - /generated/fluent-bit.conf
        env:
        - name: PGSERVICE
          value: roachmotel
        - name: PGSERVICEFILE
          value: /generated/pg_service.conf
        ports:
        - name: http
          containerPort: 2020
        readinessProbe:
          httpGet:
            path: /api/v1/metrics
            port: http
        livenessProbe:
          httpGet:
            path: /api/v1/metrics
            port: http
          initialDelaySeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          runAsUser: 0
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: logs
          mountPath: /var/log
          readOnly: true
        - name: state
          mountPath: /var/lib/fluent-bit
        - name: generated
          mountPath: /generated
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: fluent-bit-config
      - name: logs
        hostPath:
          path: /var/log
          type: Directory
      - name: state
        hostPath:
          path: /var/lib/roachmotel-fluent-bit
          type: DirectoryOrCreate
      - name: credentials
        secret:
          secretName: roachmotel-credentials
          defaultMode: 256
      - name: generated
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      initContainers:
      - name: prepare-connection
        image: python:3.13-alpine
        command:
        - python3
        - /config/prepare.py
        - /credentials/connection-string
        - /config/fluent-bit.conf
        - /generated
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: credentials
          mountPath: /credentials
          readOnly: true
        - name: generated
          mountPath: /generated
