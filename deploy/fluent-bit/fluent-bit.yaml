apiVersion: v1
kind: Namespace
metadata:
  name: logs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: roachmotel-fluent-bit
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - namespaces
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: roachmotel-fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: roachmotel-fluent-bit
subjects:
- kind: ServiceAccount
  name: fluent-bit
  namespace: logs
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logs
spec:
  selector:
    matchLabels:
      app: roachmotel-fluent-bit
  template:
    metadata:
      labels:
        app: roachmotel-fluent-bit
    spec:
      serviceAccountName: fluent-bit
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - operator: Exists
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # pgsql requires separate host/port even when Database is a full URI.
      # Render those from the Secret without writing credentials into the config.
      initContainers:
      - name: configure
        image: python:3.13-alpine
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: roachkey
              key: DATABASE_URL
        command: [python3, -B, -c]
        args:
        - |
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          url = urlsplit(os.environ["DATABASE_URL"])
          if url.scheme not in ("postgres", "postgresql") or not url.hostname:
              raise SystemExit("DATABASE_URL must be a PostgreSQL URL with a host")
          config = Path("/fluent-bit/config/fluent-bit.conf").read_text()
          config = config.replace("${DATABASE_HOST}", url.hostname)
          config = config.replace("${DATABASE_PORT}", str(url.port or 5432))
          Path("/fluent-bit/runtime/fluent-bit.conf").write_text(config)
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: config
          mountPath: /fluent-bit/config
          readOnly: true
        - name: runtime
          mountPath: /fluent-bit/runtime
      containers:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:4.2.3
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: roachkey
              key: DATABASE_URL
        args:
        - -c
        - /fluent-bit/runtime/fluent-bit.conf
        ports:
        - name: http
          containerPort: 2020
        readinessProbe:
          httpGet:
            path: /api/v1/metrics
            port: http
        livenessProbe:
          httpGet:
            path: /api/v1/metrics
            port: http
          initialDelaySeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          runAsUser: 0
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: logs
          mountPath: /var/log
          readOnly: true
        - name: state
          mountPath: /var/lib/fluent-bit
        - name: runtime
          mountPath: /fluent-bit/runtime
          readOnly: true
      volumes:
      - name: runtime
        emptyDir: {}
      - name: config
        configMap:
          name: fluent-bit-config
      - name: logs
        hostPath:
          path: /var/log
          type: Directory
      - name: state
        hostPath:
          path: /var/lib/roachmotel-fluent-bit
          type: DirectoryOrCreate
