apiVersion: v1
kind: Service
metadata:
  name: log-writer
  namespace: logs
spec:
  selector:
    app: roachmotel-log-writer
  ports:
    - port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-writer
  namespace: logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: roachmotel-log-writer
  template:
    metadata:
      labels:
        app: roachmotel-log-writer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: paulgmiller/roachmotel-log-writer:fluent-bit
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: credentials
              mountPath: /credentials
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: roachkey
            defaultMode: 0440
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: log-writer
  namespace: logs
spec:
  podSelector:
    matchLabels:
      app: roachmotel-log-writer
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: roachmotel-fluent-bit
      ports:
        - protocol: TCP
          port: 8080
