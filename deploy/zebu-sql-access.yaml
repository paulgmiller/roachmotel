apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: roachmotel-sql-access
  namespace: cockroach
spec:
  podSelector:
    matchLabels:
      app: cockroachdb
      app.kubernetes.io/instance: cockroachdb-secure
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: roachmotel-system
          podSelector:
            matchLabels:
              app: roachmotel
      ports:
        - protocol: TCP
          port: 26257
