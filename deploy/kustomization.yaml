apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - operator.yaml
images:
  - name: roachmotel
    newName: paulgmiller/roachmotel
    digest: sha256:a49b19673437e75a1988b9fed2c54f56eee868ecdfa0ed4aba5702db8194ea0a
patches:
  - target:
      kind: Deployment
      name: roachmotel
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: postgresql://cockroachdb-secure-public.cockroach.svc.cluster.local:26257/?sslmode=require
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: cockroach,cockroach-operator-system,traefik,wg,whoami,local-path-storage
