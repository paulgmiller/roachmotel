apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - operator.yaml
  - fluent-bit
images:
  - name: roachmotel
    newName: paulgmiller/roachmotel
    newTag: fluent-bit
patches:
  - target:
      kind: Deployment
      name: roachmotel
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: postgresql://cockroachdb-secure-public.cockroach.svc.cluster.local:26257/?sslmode=require
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: cockroach,cockroach-operator-system,traefik,wg,whoami,local-path-storage

